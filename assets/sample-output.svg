<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="360" rx="14" fill="#0d1117"/>
  <rect width="900" height="36" rx="14" fill="#161b22"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/><circle cx="46" cy="18" r="6" fill="#ffbd2e"/><circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="23" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8b949e">netscan - example output (illustrative)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="15">
    <text x="24" y="72" fill="#34d399">$ python3 netscan.py 192.168.1.10</text>
    <text x="24" y="104" fill="#e6edf3">[*] Discovering hosts...</text>
    <text x="24" y="130" fill="#e6edf3">[+] Host up: 192.168.1.10</text>
    <text x="24" y="156" fill="#e6edf3">[*] Scanning ports...</text>
    <text x="24" y="182" fill="#e6edf3">    22/tcp   open   ssh     OpenSSH 7.2</text>
    <text x="24" y="208" fill="#e6edf3">    80/tcp   open   http    Apache 2.4.18</text>
    <text x="24" y="240" fill="#f87171">[!] VULNERABLE: outdated OpenSSH version</text>
    <text x="24" y="266" fill="#fbbf24">[!] WARNING: outdated Apache version</text>
    <text x="24" y="302" fill="#22d3ee">[+] Report saved to report.txt</text>
  </g>
</svg>
